<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>你畫了沒</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="banner" hidden></div>
<div id="lock" hidden>
  <div class="lockbox">
    <h1>你畫了沒</h1>
    <p id="lockMsg"></p>
    <input type="password" id="pw1" placeholder="密碼" autocomplete="current-password">
    <input type="password" id="pw2" placeholder="再輸入一次" hidden autocomplete="new-password">
    <button id="pwGo" class="primary">進入</button>
  </div>
</div>
<div id="app" hidden>
  <header>
    <div class="brand">你畫了沒</div>
    <select id="planSel" title="切換計畫"></select>
    <button data-a="newPlan">＋計畫</button>
    <span class="grow"></span>
    <span id="saved" class="muted"></span>
    <button data-a="export" title="把這台電腦上所有計畫（含照片、自訂範本）存成一個 .json 檔">匯出全部</button>
    <label class="btn" title="從 .json 備份檔還原（會覆蓋目前資料）">匯入 .json<input type="file" id="importFile" accept=".json" hidden></label>
  </header>
  <div id="fbar"></div>
  <div class="layout">
    <nav id="side"></nav>
    <main id="main"></main>
  </div>
</div>
<div id="modal" hidden><div class="mbox" id="mbox"></div></div>
<div id="toast" hidden></div>
<script src="lib/jszip.min.js"></script>
<script src="engine.js"></script>
<script src="defs.js"></script>
<script src="model.js"></script>
<script src="app.js"></script>
<script src="file.js"></script>
</body>
</html>
